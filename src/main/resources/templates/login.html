<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zookeeper Login — AI Zoo Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        <!-- Card Header -->
        <div class="bg-blue-900 text-white p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-800 text-3xl mb-3 shadow-inner">
                🦁
            </div>
            <h1 class="text-2xl font-bold tracking-tight">AI ZOO PLANNER</h1>
            <p class="text-blue-200 text-sm mt-1">Zookeeper Portal & Decision Support</p>
        </div>

        <!-- Form Body -->
        <div class="p-8">
            <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" value="zookeeper" required
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-600 focus:bg-white focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" value="password" required
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-600 focus:bg-white focus:outline-none transition">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <span>Login to AI Zoo Assistant</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
                <p class="font-medium text-slate-600">Demo Zookeeper Credentials:</p>
                <p class="mt-1 font-mono text-slate-500">Username: <span class="text-blue-600 font-bold">zookeeper</span> | Password: <span class="text-blue-600 font-bold">password</span></p>
            </div>
        </div>
    </div>

</body>
</html>
